name: Обновление новостей тенниса

on:
  schedule:
    - cron: "2-57/5 * * * *"   # каждые 5 минут (минимум у GitHub Actions), со сдвигом от круглых отметок
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Собрать заголовки из RSS
        run: python3 scripts/fetch_news.py
      - name: Опубликовать news.json в ветку news-data
        run: |
          mkdir "$RUNNER_TEMP/out" && cp news.json "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -qm "news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-data
